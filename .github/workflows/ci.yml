# Milestone #3: CI — run the Rust toolchain and the full parity test suite
# on every push and pull request. Pure-Rust rustls transport means no system
# OpenSSL is required, so the stock Ubuntu runner suffices.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build + lint + test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Ensure clippy + rustfmt components
        # dtolnay/rust-toolchain installs only rustup's default components
        # (rustc, std, cargo, docs); clippy/rustfmt are NOT included, and the
        # `beta` toolchain on the runner is shipped without clippy. Add both
        # explicitly so both lint steps work on every toolchain in the matrix.
        run: rustup component add clippy rustfmt

      - name: Cache Cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.rust }}-

      # The generated crate (`client/`) is 100% reproducible from the template
      # (regen.sh); it is excluded from clippy/fmt by construction:
      # lib.rs ships the crate-level `#![allow(clippy::needless_return)]` and
      # `#![allow(clippy::derivable_impls)]` that the generator emits.
      - name: Clippy — whole workspace, warnings are errors
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: rustfmt — hand-authored crate only
        # `cargo fmt --all` would also format the generated client/; on stable
        # the rustfmt `ignore` list is nightly-only, so we scope to the
        # hand-authored package (src/ + tests/).
        run: cargo fmt -p emasser -- --check

      - name: Build all targets
        run: cargo build --locked --all-targets

      - name: Unit + integration tests
        run: cargo test --locked --workspace

      - name: Byte-parity + wire-capture tests
        run: cargo test --locked --test byte_parity --test parity_capture

      - name: CLI smoke test — command → emass_client path gate
        # Drives the built `emasser` binary through the full command surface
        # (GET/POST/PUT/DELETE) against an in-process HTTP server and asserts
        # each command exits successfully, targets the expected resource path,
        # and uses the correct HTTP verb. Reuses the parity_capture.rs
        # mock-server pattern.
        run: cargo test --locked --test smoke
