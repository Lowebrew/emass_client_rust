# rustfmt configuration for the emasser workspace.
#
# Only the hand-authored crate is gated on `cargo fmt` (`cargo fmt -p emasser`,
# `src/` + `tests/`). The `client/` crate is 100% generated by the openapi-
# generator rust template (`references/pipeline_inputs/ct/lib.mustache`) and is
# byte-for-byte reproduced by `regen.sh`, so rustfmt must NOT touch it.
#
# NOTE: the `ignore` list is a nightly-only rustfmt feature; on stable it is
# silently dropped. To keep `cargo fmt` off the generated crate on stable, the
# CI and developers scope it with `-p emasser` instead of `--all`. See
# `.github/workflows/ci.yml`.
